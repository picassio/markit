name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          # Pinned: a newer clippy brings new lints that fail `-D warnings` on code that did not change.
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> rust/target
      - run: bun install --frozen-lockfile
      # Bootstrap the first scoped release: until markit-engine-* exists,
      # Bun may skip unrelated optional platform packages such as Biome's.
      - run: npm install --no-save @biomejs/cli-linux-x64
      - name: Check Node shell
        run: bun run check && npm run build
      - name: Check Rust engine
        run: npm run check:rust && cd rust && cargo test
      # Guards the committed benchmark manifest, its 155 blind anchors, and
      # the tool-version provenance. Pure stdlib, so no Python setup step.
      - name: Test benchmark harness
        run: cd benchmark && python3 -m unittest test_benchmark.py
      - name: Build current-platform addon
        run: npm run build:native
      - name: Test native Node SDK
        run: bun test
      - name: Smoke packed package
        run: |
          npm pack --dry-run
          node -e "import('./dist/index.js').then(async ({Markit}) => { const r = await new Markit().convert(Buffer.from('native'), {extension: '.txt'}); if (r.markdown !== 'native') process.exit(1) })"

  # Android's Node (Termux, pi-phone) links against bionic: it needs its own build, made with the NDK GitHub's runners
  # carry (`ANDROID_NDK_LATEST_HOME`, which napi-rs uses for its compiler and linker).
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          # Pinned: a newer clippy brings new lints that fail `-D warnings` on code that did not change.
          toolchain: 1.98.0
          targets: aarch64-linux-android
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> rust/target
          key: aarch64-linux-android
      - run: bun install --frozen-lockfile
      - name: Build native addon for Android
        run: >-
          bunx napi build --release --strip --platform
          --target aarch64-linux-android
          --features napi --cargo-flags=--no-default-features
          --cargo-cwd rust
      - run: file markit.android-arm64.node && ls -l markit.android-arm64.node
      - uses: actions/upload-artifact@v4
        with:
          name: bindings-aarch64-linux-android
          path: markit.android-arm64.node
          if-no-files-found: error
